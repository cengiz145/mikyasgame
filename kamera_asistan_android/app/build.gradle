plugins {
    id 'com.android.application'
}

android {
    namespace 'tr.com.mikyasstudio.kameraasistani'
    compileSdk 36

    defaultConfig {
        applicationId "tr.com.mikyasstudio.erisilebilirkamera"
        minSdk 24
        targetSdk 36
        versionCode 68
        versionName "51.9.0"
    }

    signingConfigs {
        release {
            storeFile file("mikyas-release.jks")
            storePassword "mikyas2026"
            keyAlias "mikyas_release"
            keyPassword "mikyas2026"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
