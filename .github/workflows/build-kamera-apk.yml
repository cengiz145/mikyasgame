name: Build Mikyas Kamera ve Sinav Asistani APK

on:
  push:
    branches: [ main ]
    paths:
      - 'kamera_asistan/index.html'
      - 'kamera_asistan/app.js'
      - 'kamera_asistan/style.css'
      - 'kamera_asistan_android/**'
      - '.github/workflows/build-kamera-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Release Keystore Exists
        run: |
          if [ ! -f kamera_asistan_android/app/mikyas-release.jks ]; then
            keytool -genkeypair -v \
              -keystore kamera_asistan_android/app/mikyas-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias mikyas_release \
              -storepass mikyas2026 -keypass mikyas2026 \
              -dname "CN=Erisilebilir Kamera Uygulamasi, OU=Erisilebilirlik, O=Mikyas Studio, L=Istanbul, ST=Istanbul, C=TR"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web Assets into Android APK Assets
        run: |
          mkdir -p kamera_asistan_android/app/src/main/assets/www
          cp kamera_asistan/index.html kamera_asistan_android/app/src/main/assets/www/
          cp kamera_asistan/style.css kamera_asistan_android/app/src/main/assets/www/
          cp kamera_asistan/app.js kamera_asistan_android/app/src/main/assets/www/
          cp kamera_asistan/manifest.json kamera_asistan_android/app/src/main/assets/www/

      - name: Build Signed Release APK
        working-directory: kamera_asistan_android
        run: gradle assembleRelease --no-daemon

      - name: Publish APK to kamera_asistan/MikyasKameraAsistani.apk
        run: |
          cp kamera_asistan_android/app/build/outputs/apk/release/app-release.apk kamera_asistan/MikyasKameraAsistani.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f kamera_asistan/MikyasKameraAsistani.apk kamera_asistan_android/app/mikyas-release.jks
          if ! git diff --staged --quiet; then
            git commit -m "build(apk): Update Play Protect clean signed MikyasKameraAsistani.apk [skip ci]"
            git push origin HEAD:main
          fi
