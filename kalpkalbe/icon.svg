<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0928" />
      <stop offset="50%" stop-color="#0d0414" />
      <stop offset="100%" stop-color="#2d0a2e" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4380" />
      <stop offset="50%" stop-color="#ff1a53" />
      <stop offset="100%" stop-color="#ff7b90" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d60" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff2d60" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ff2a6d" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Arka Plan -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Parlama Efekti -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>
  
  <!-- Çift Kalp Sembolü (İç İçe Geçen Aşk) -->
  <g filter="url(#shadow)">
    <!-- Sol Kalp -->
    <path d="M210 140 C160 90 90 120 90 190 C90 270 210 350 210 350 C210 350 140 260 140 200 C140 160 180 140 210 170 Z" fill="#ff758f" opacity="0.85"/>
    <!-- Ana Büyük Kalp -->
    <path d="M256 395 C256 395 130 300 130 200 C130 130 185 105 230 145 L256 170 L282 145 C327 105 382 130 382 200 C382 300 256 395 256 395 Z" fill="url(#heartGrad)"/>
  </g>
  
  <!-- Küçük Işıltı Yıldızları -->
  <circle cx="360" cy="140" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="150" cy="300" r="4" fill="#fff" opacity="0.7"/>
  <circle cx="340" cy="320" r="5" fill="#ff758f" opacity="0.8"/>
</svg>
